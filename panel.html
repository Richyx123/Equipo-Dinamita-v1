<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecFind - Panel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="./css/style2.css">
</head>
<body class="bg-body-secondary">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="fs-4 fw-bold text-white">TecFind</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light d-none d-md-block" id="user-email-display">usuario@itm.edu.mx</span>
                <button id="btn-logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Mapa del Campus ITM</h5>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalReporte">
                            + Nuevo Reporte
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div id="map-container" class="bg-light d-flex justify-content-center align-items-center">
                            <p class="text-muted mb-0">Cargando mapa interactivo...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Últimos Reportes</h5>
                    </div>
                    <div class="card-body feed-container" id="feed-reportes">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalReporte" tabindex="-1" aria-labelledby="modalReporteLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalReporteLabel">Reportar Objeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="form-nuevo-reporte">
                        <div class="mb-3">
                            <label class="form-label">Tipo de reporte</label>
                            <select class="form-select" id="tipo_reporte" required>
                                <option value="perdido">Lo perdí</option>
                                <option value="encontrado">Lo encontré</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">¿Qué objeto es?</label>
                            <input type="text" class="form-control" id="titulo_objeto" placeholder="Ej: Calculadora Casio, Llaves..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lugar de referencia</label>
                            <input type="text" class="form-control" id="lugar_referencia" placeholder="Ej: Laboratorio de cómputo, Cafetería..." required>
                        </div>
                        <input type="hidden" id="latitud">
                        <input type="hidden" id="longitud">
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Publicar Reporte</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/script2.js"></script>
</body>
</html>
